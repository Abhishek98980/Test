<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Greeen Basket header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="gb.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&amp;family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header class="gb {{themeClass}}" style="position: relative; z-index: 30; font-family: Rubik, 'Noto Sans Devanagari', system-ui, sans-serif; color: var(--text); background: var(--bg);">
  <a class="btn btn-ink btn-sm skip" href="#main">Skip to content</a>

  <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
    <div style="background: var(--band); color: var(--on-band);">
      <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px; padding-block: 9px; font-size: 13px; line-height: 1.4;">
        <span style="display: inline-flex; align-items: center; gap: 8px;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>Next delivery slot: <b style="font-weight: 600;">today, 4–6&nbsp;PM</b> <span style="color: var(--on-band-muted);">(example)</span></span>
        </span>
        <span style="display: inline-flex; flex-wrap: wrap; gap: 4px 20px;">
          <a href="Wholesale.dc.html" style="color: var(--on-band); text-decoration: none;">Wholesale rates for everyone</a>
          <a href="Contact.dc.html" style="color: var(--on-band); text-decoration: none;">Help and contact</a>
        </span>
      </div>
    </div>
  </sc-if>

  <div class="chrome" style="border-bottom: 1px solid var(--line);">
    <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px;">
      <a href="Main.dc.html" aria-label="Greeen Basket home" translate="no" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-strong);">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 32 32"><path d="M16 2l12 7v14l-12 7-12-7V9z" style="fill: var(--accent);"></path><path d="M16 23c-5-2-7-7-5-12 5 0 8 4 5 12zm0 0c1-6 4-9 8-9 0 5-3 8-8 9z" style="fill: var(--on-accent);"></path></svg>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Greeen Basket</span>
      </a>

      <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
        <button type="button" class="chip" style="min-height: 48px; padding: 0 16px 0 12px; gap: 8px;">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-text);"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
          <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15;"><span class="t-xs t-muted">Deliver to</span><span class="num" style="font-weight: 600;">160022, Chandigarh</span></span>
        </button>

        <form role="search" onSubmit="{{onSubmit}}" style="flex: 1 1 300px; position: relative; min-width: 0;">
          <label for="hd-q" class="sr-only">Search fruits and vegetables</label>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="position: absolute; left: 16px; top: 14px; color: var(--text-muted); pointer-events: none;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input id="hd-q" class="input input-pill" type="search" name="q" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Search “tomato”, “methi” or “kinnow”…" value="{{q}}" onChange="{{onQ}}" aria-controls="hd-suggest" aria-expanded="{{suggestExpanded}}" style="padding-left: 46px;">
          <sc-if value="{{showSuggest}}" hint-placeholder-val="{{false}}">
            <div id="hd-suggest" class="card-raised" style="position: absolute; left: 0; right: 0; top: 56px; padding: 8px; z-index: 40;">
              <p class="t-xs t-muted" style="padding: 6px 10px 4px;">Suggestions</p>
              <ul role="list">
                <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="3">
                  <li><a href="Product.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 10px; border-radius: var(--r-sm); color: var(--text-strong); text-decoration: none;"><img src="{{s.img}}" alt="" width="32" height="32" style="width: 32px; height: 32px;"><span style="flex: 1; min-width: 0;">{{s.name}} <span class="hi t-muted" style="font-size: 13px;">{{s.hi}}</span></span><span class="t-sm t-muted num">{{s.unit}}</span></a></li>
                </sc-for>
              </ul>
              <sc-if value="{{noSuggest}}" hint-placeholder-val="{{false}}"><p class="t-sm" style="padding: 10px;">No match for “{{q}}”. Try a Hindi name, like <span class="hi">टमाटर</span>.</p></sc-if>
            </div>
          </sc-if>
        </form>
      </sc-if>

      <sc-if value="{{minimal}}" hint-placeholder-val="{{false}}">
        <span class="t-sm t-muted" style="display: inline-flex; align-items: center; gap: 8px; margin-left: 8px;">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Secure checkout
        </span>
      </sc-if>

      <nav aria-label="Account and basket" style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
        <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
          <a href="Account.dc.html" class="btn btn-ghost btn-sm">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
            Account
          </a>
          <a href="Cart.dc.html" class="btn btn-ink btn-sm" aria-label="{{cartLabel}}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5z"></path><path d="M8 10l4-6 4 6"></path></svg>
            Basket
            <span class="badge badge-leaf num" style="min-width: 24px; justify-content: center;">{{cartCount}}</span>
          </a>
        </sc-if>
        <sc-if value="{{minimal}}" hint-placeholder-val="{{false}}">
          <a href="Cart.dc.html" class="btn btn-ghost btn-sm">Back to basket</a>
        </sc-if>
      </nav>
    </div>

    <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
      <nav aria-label="Departments" class="wrap" style="display: flex; flex-wrap: wrap; gap: 0 28px; overflow-x: auto;">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
          <a href="{{n.href}}" aria-current="{{n.current}}" style="display: inline-flex; align-items: center; min-height: 48px; border-bottom: 2px solid {{n.bar}}; margin-bottom: -1px; font-size: 15px; font-weight: {{n.weight}}; color: {{n.color}}; text-decoration: none; white-space: nowrap;">{{n.label}}</a>
        </sc-for>
      </nav>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["none","veg","fruit","greens","exotic","farmbox","subscriptions","wholesale","offers"],"default":"none"},"variant":{"editor":"enum","options":["full","minimal"],"default":"full"},"dark":{"editor":"boolean","default":false},"cartCount":{"editor":null},"cartTotal":{"editor":null},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { q: '' };
  }

  renderVals() {
    const B = '/_blob/';
    const active = this.props.active ?? 'none';
    const dark = this.props.dark ?? false;
    const variant = this.props.variant ?? 'full';
    const count = this.props.cartCount ?? 0;
    const items = [
      ['Tomato', 'टमाटर', '1 kg', '90234e112587bcb63afe69728f9038ca'],
      ['Cherry tomato', 'चेरी टमाटर', '200 g', 'c6dad24929836806f85f635de05f562a'],
      ['Onion', 'प्याज़', '1 kg', '1684583e7b1031c43645cbd222ff8d0d'],
      ['Potato', 'आलू', '1 kg', '0665993fcaf8a6b84a0bae1442b3275a'],
      ['Fenugreek', 'मेथी', '1 bunch', '0e0c61ea89660ecc92ca466f7b232d85'],
      ['Spinach', 'पालक', '1 bunch', 'd7b00861d43b60387799340029aefdd9'],
      ['Kinnow', 'किन्नू', '1 kg', 'fd2079b5997095279838843a25a8bb23'],
      ['Okra', 'भिंडी', '500 g', '5bc8dcee307c27bd019357e52ebc8622'],
      ['Coriander', 'धनिया', '1 bunch', '591d27931e70b0646c12012b692f0728'],
      ['Apple, Shimla', 'सेब', '1 kg', '8581b06e9c225f563a590d141aab53d4']
    ];
    const raw = this.state.q.trim();
    const q = raw.toLowerCase();
    const suggestions = q
      ? items.filter((i) => i[0].toLowerCase().includes(q) || i[1].includes(raw)).slice(0, 5)
          .map((i) => ({ name: i[0], hi: i[1], unit: i[2], img: B + i[3] }))
      : [];
    const navDefs = [
      ['veg', 'Vegetables', 'Main.dc.html#shop'],
      ['fruit', 'Fruits', 'Main.dc.html#shop'],
      ['greens', 'Leafy greens and herbs', 'Main.dc.html#shop'],
      ['exotic', 'Exotics', 'Main.dc.html#shop'],
      ['farmbox', 'Farm Box', 'FarmBox.dc.html'],
      ['subscriptions', 'Subscriptions', 'Subscriptions.dc.html'],
      ['wholesale', 'Wholesale', 'Wholesale.dc.html'],
      ['offers', 'This week’s deals', 'Main.dc.html#deals']
    ];
    const nav = navDefs.map((n) => {
      const on = n[0] === active;
      return {
        label: n[1], href: n[2], current: on ? 'page' : undefined,
        bar: on ? 'var(--accent)' : 'transparent',
        color: on ? 'var(--text-strong)' : 'var(--text)',
        weight: on ? '600' : '500'
      };
    });
    return {
      themeClass: dark ? 'dark' : '',
      full: variant === 'full',
      minimal: variant === 'minimal',
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      onSubmit: (e) => e.preventDefault(),
      showSuggest: q.length > 0,
      suggestExpanded: q.length > 0 ? 'true' : 'false',
      suggestions,
      noSuggest: q.length > 0 && suggestions.length === 0,
      nav,
      cartCount: String(count),
      cartLabel: 'Basket, ' + count + (count === 1 ? ' item' : ' items') + (this.props.cartTotal ? ', ' + this.props.cartTotal : '')
    };
  }
}
</script>
</body>
</html>
